port: 7890
socks-port: 7891
redir-port: 7892
mixed-port: 7893
mode: rule
log-level: info
unified-delay: true
tcp-concurrent: true
ipv6: false
keep-alive-interval: 360
keep-alive-idle: 15
disable-keep-alive: false

clash-for-android:
  append-system-dns: false

profile:
  store-selected: true

dns:
  enable: true
  enhanced-mode: redir-host
  cache-algorithm: lru
  cache-max-size: 1
  default-nameserver:
    - 'udp://119.29.29.29:53'
    - 'udp://223.5.5.5:53'
  nameserver:
    - 'udp://119.29.29.29:53'
    - 'udp://223.5.5.5:53'
    - 'tls://119.29.29.29'
    - 'tls://223.5.5.5'
    - 'https://dns.pub/dns-query'
    - 'https://dns.alidns.com/dns-query'
  proxy-server-nameserver:
    - 'udp://119.29.29.29:53'
    - 'udp://223.5.5.5:53'

